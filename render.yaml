# Render Blueprint for the online room server (the game itself is on Vercel).
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: 3d-8ball-server
    runtime: node
    plan: free # sleeps after ~15 min idle; the game shows "waking up" while it starts
    region: frankfurt
    branch: main
    buildCommand: npm ci # NODE_ENV=production: only runtime deps (socket.io)
    startCommand: npm run server # Node runs server/*.ts directly (type stripping)
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      # only the game's site may connect (checked on websocket connections too)
      - key: ALLOWED_ORIGINS
        value: https://3d-8ball.vercel.app
